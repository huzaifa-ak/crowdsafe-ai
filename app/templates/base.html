<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CrowdSafe AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="{{ url_for('pages.dashboard') }}">
      <span class="wordmark-mark" aria-hidden="true"></span>
      CrowdSafe
    </a>
    <nav class="masthead-nav">
      {% block nav %}{% endblock %}
    </nav>
  </header>

  <main class="{% block main_class %}sheet{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
